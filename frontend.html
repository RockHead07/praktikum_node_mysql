<!DOCTYPE html>
<html>
<head>
  <title>Data Mahasiswa (Node.js)</title>
  <style>
    table {
      border-collapse: collapse;
      width: 60%;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f0f0f0;
    }
    h2 {
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Data Mahasiswa (Dari Node.js API)</h2>
  <table id="mahasiswa-table">
    <thead>
      <tr><th>ID</th><th>Nama</th><th>NPM</th><th>Jurusan</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    fetch('http://localhost:3000/mahasiswa')
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector('#mahasiswa-table tbody');
        data.forEach(mhs => {
          const row = `<tr>
            <td>${mhs.id}</td>
            <td>${mhs.nama}</td>
            <td>${mhs.npm}</td>
            <td>${mhs.jurusan}</td>
          </tr>`;
          tbody.innerHTML += row;
        });
      });
  </script>
</body>
</html>
